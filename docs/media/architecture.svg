<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>CaseFlow architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fa8c8"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker>
  </defs>
  <rect width="1060" height="560" fill="#0b1119"/>
  <text x="24" y="34" fill="#dde9f3" font-size="16" font-weight="700">Three parts on one machine, and a neural network trained on the engine's own simulations</text>
  <text x="24" y="54" fill="#8b98a9" font-size="12">the engine simulates a layout once (its bank); the network predicts any layout's bank in ~0.1 s; the browser solves any room, load and fan curve from a bank in milliseconds</text>

  <!-- browser -->
  <g transform="translate(24,80)">
    <rect width="300" height="300" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
    <path d="M0 0 h12 M0 0 v12" stroke="#63e0ff" stroke-width="2"/>
    <text x="16" y="28" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">WEB · localhost:5190</text>
    <text x="16" y="52" fill="#dde9f3" font-weight="700" font-size="14">Browser app</text>
    <text x="16" y="72" fill="#8b98a9" font-size="12">React + three.js (Vite)</text>
    <g font-size="12" fill="#c3d0dc">
      <text x="16" y="100"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">scenario.ts</tspan>  fan curves ⇄ temps,</text>
      <text x="28" y="116">steady state in ~1 ms per layout</text>
      <text x="16" y="136">· 3D heat = P_cpu · k_cpu + P_gpu · k_gpu</text>
      <text x="16" y="156">· 32 layouts re-ranked live</text>
      <text x="16" y="176" fill="#c3b2ff">· AI first: a new layout's prediction at once,</text>
      <text x="28" y="192" fill="#c3b2ff">Verify: the simulation and the difference</text>
      <text x="16" y="212" fill="#c3b2ff">· all 6561 predicted layouts ranked (worker)</text>
    </g>
    <rect x="16" y="228" width="268" height="58" fill="rgba(99,224,255,0.06)" stroke="#2f7fa3"/>
    <text x="28" y="246" fill="#dde9f3" font-size="11.5">public/data/</text>
    <text x="28" y="262" fill="#8b98a9" font-size="11">your layout's bank, 32 bank summaries,</text>
    <text x="28" y="277" fill="#8b98a9" font-size="11">ai_space.json (6561 predictions): offline</text>
  </g>

  <!-- server -->
  <g transform="translate(380,80)">
    <rect width="290" height="300" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
    <path d="M0 0 h12 M0 0 v12" stroke="#63e0ff" stroke-width="2"/>
    <text x="16" y="28" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">API · 127.0.0.1:8600</text>
    <text x="16" y="52" fill="#dde9f3" font-weight="700" font-size="14">FastAPI service</text>
    <text x="16" y="72" fill="#8b98a9" font-size="12">server/app.py</text>
    <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" fill="#c3d0dc">
      <text x="16" y="104">GET  /api/library, /api/default_build</text>
      <text x="16" y="124">POST /api/bank      → job id</text>
      <text x="16" y="144">GET  /api/job/{id}  → progress</text>
      <text x="16" y="164" fill="#c3b2ff">POST /api/ai        → predicted bank</text>
      <text x="16" y="184" fill="#c3b2ff">GET  /api/ai/info   → model card</text>
    </g>
    <text x="16" y="216" fill="#8b98a9" font-size="11.5">a cached bank returns at once; a new</text>
    <text x="16" y="232" fill="#8b98a9" font-size="11.5">layout runs (~90 s) only on Verify, one job</text>
    <text x="16" y="248" fill="#8b98a9" font-size="11.5">at a time; the network answers in ~0.1 s</text>
    <text x="16" y="264" fill="#8b98a9" font-size="11.5">and refuses builds unlike its training</text>
    <text x="16" y="280" fill="#8b98a9" font-size="11.5">data (other parts or fan models)</text>
  </g>

  <!-- engine -->
  <g transform="translate(726,80)">
    <rect width="310" height="300" fill="rgba(217,119,43,0.06)" stroke="#8a5328"/>
    <path d="M0 0 h12 M0 0 v12" stroke="#d9772b" stroke-width="2"/>
    <text x="16" y="28" fill="#d9772b" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">ENGINE · PyTorch on the GPU</text>
    <text x="16" y="52" fill="#dde9f3" font-weight="700" font-size="14">engine/</text>
    <g font-size="12" fill="#c3d0dc">
      <text x="16" y="78"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">sim.py</tspan>  build → grid, fan operating point</text>
      <text x="16" y="98"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">lbm.py</tspan>  D3Q19 lattice Boltzmann (batched)</text>
      <text x="16" y="118"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">thermal.py</tspan>  heat per watt (batched)</text>
      <text x="16" y="138"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">bank.py</tspan>  3 fan speeds → bank, cache</text>
      <text x="16" y="158"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">scenario.py</tspan>  the same solver as the web</text>
      <text x="16" y="178"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#dde9f3">optimize.py</tspan>  32 layouts, ranked per scenario</text>
      <text x="16" y="198" fill="#c3b2ff"><tspan font-family="IBM Plex Mono, Consolas, monospace" fill="#c3b2ff">surrogate.py</tspan>  3D U-Net: voxels → fields</text>
    </g>
    <rect x="16" y="214" width="278" height="72" fill="rgba(217,119,43,0.08)" stroke="#8a5328"/>
    <text x="28" y="234" fill="#dde9f3" font-size="11.5">data/banks/ (cache) · data/optimize.json</text>
    <text x="28" y="251" fill="#8b98a9" font-size="11">data/parts/library.json · data/validation.json</text>
    <text x="28" y="268" fill="#c3b2ff" font-size="11">data/surrogate/: dataset, trained network</text>
  </g>

  <!-- arrows -->
  <g stroke="#6fa8c8" stroke-width="1.4" fill="none">
    <path d="M326 200 H376" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M672 200 H722" marker-end="url(#a)" marker-start="url(#a)"/>
  </g>
  <text x="351" y="190" fill="#8b98a9" font-size="10.5" text-anchor="middle">/api</text>
  <text x="351" y="218" fill="#8b98a9" font-size="10.5" text-anchor="middle">proxy</text>
  <text x="697" y="190" fill="#8b98a9" font-size="10.5" text-anchor="middle">calls</text>
  <path d="M881 380 V398 H174 V384" stroke="#2f7fa3" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="528" y="414" fill="#6fa8c8" font-size="10.5" text-anchor="middle">scripts/precompute.py and scripts/ai_space.py write the offline data</text>

  <!-- the AI loop -->
  <g transform="translate(24,434)">
    <rect width="1012" height="108" fill="rgba(144,133,233,0.06)" stroke="#5b5299"/>
    <path d="M0 0 h12 M0 0 v12" stroke="#9085e9" stroke-width="2"/>
    <text x="16" y="24" fill="#c3b2ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">AI LOOP · the network learns from the simulator, the simulator checks the network</text>
    <g font-size="11.5">
      <rect x="16" y="38" width="220" height="56" fill="rgba(144,133,233,0.08)" stroke="#5b5299"/>
      <text x="28" y="58" fill="#dde9f3" font-weight="700">1 · simulate</text>
      <text x="28" y="76" fill="#8b98a9">random layouts of the 8 mounts</text>
      <text x="28" y="90" fill="#8b98a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">gen_surrogate_data.py</text>
      <rect x="268" y="38" width="220" height="56" fill="rgba(144,133,233,0.08)" stroke="#5b5299"/>
      <text x="280" y="58" fill="#dde9f3" font-weight="700">2 · train the 3D U-Net</text>
      <text x="280" y="76" fill="#8b98a9">every 7th layout held out to test</text>
      <text x="280" y="90" fill="#8b98a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">train_surrogate.py</text>
      <rect x="520" y="38" width="220" height="56" fill="rgba(144,133,233,0.08)" stroke="#5b5299"/>
      <text x="532" y="58" fill="#dde9f3" font-weight="700">3 · predict</text>
      <text x="532" y="76" fill="#8b98a9">any layout in ~0.1 s, all 6561 at once</text>
      <text x="532" y="90" fill="#8b98a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">/api/ai · ai_space.py</text>
      <rect x="772" y="38" width="224" height="56" fill="rgba(144,133,233,0.08)" stroke="#5b5299"/>
      <text x="784" y="58" fill="#dde9f3" font-weight="700">4 · check</text>
      <text x="784" y="76" fill="#8b98a9">Verify simulates what the app shows,</text>
      <text x="784" y="90" fill="#8b98a9">with the difference (AI window)</text>
    </g>
    <g stroke="#9085e9" stroke-width="1.4" fill="none">
      <path d="M238 66 H264" marker-end="url(#v)"/>
      <path d="M490 66 H516" marker-end="url(#v)"/>
      <path d="M742 66 H768" marker-end="url(#v)"/>
    </g>
  </g>
</svg>
