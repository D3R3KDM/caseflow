<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" width="1060" height="490" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>CaseFlow's 3D U-Net</title>
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fa8c8"/></marker>
  </defs>
  <rect width="1060" height="490" fill="#0b1119"/>
  <text x="24" y="34" fill="#dde9f3" font-size="16" font-weight="700">The neural network: a 3D U-Net that turns the case's voxels into its airflow and heat</text>
  <text x="24" y="54" fill="#8b98a9" font-size="12">engine/surrogate.py · 13.5 M weights · every block: two 3×3×3 convolutions with group norm and GELU, plus a residual path</text>

  <!-- input / output -->
  <g font-size="11.5">
    <rect x="24" y="74" width="340" height="74" fill="rgba(99,224,255,0.06)" stroke="#2f7fa3"/>
    <text x="36" y="93" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">INPUT · 80 × 40 × 80 voxels of 6 mm</text>
    <text x="36" y="112" fill="#c3d0dc">solid · outside air · fan cells · fan air velocity (x, y, z)</text>
    <text x="36" y="128" fill="#c3d0dc">CPU heat zone · GPU heat zone · + x, y, z coordinates</text>
    <text x="36" y="143" fill="#8b98a9" font-size="10.5">one voxel model per case-fan speed (engine/sim.build_model)</text>
    <rect x="696" y="74" width="340" height="74" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
    <text x="708" y="93" fill="#d9772b" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">OUTPUT · 80 × 40 × 80 voxels</text>
    <text x="708" y="112" fill="#c3d0dc">air velocity (x, y, z) in m/s</text>
    <text x="708" y="128" fill="#c3d0dc">air temperature rise per watt of CPU / of GPU power</text>
    <text x="708" y="143" fill="#8b98a9" font-size="10.5">→ intake air of the CPU and GPU → part temperatures</text>
  </g>

  <!-- encoder -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11">
    <rect x="60" y="176" width="190" height="38" fill="rgba(144,133,233,0.10)" stroke="#5b5299"/>
    <text x="72" y="199" fill="#dde9f3">80×40×80 · 24 ch</text>
    <rect x="110" y="236" width="190" height="38" fill="rgba(144,133,233,0.13)" stroke="#5b5299"/>
    <text x="122" y="259" fill="#dde9f3">40×20×40 · 48 ch</text>
    <rect x="160" y="296" width="190" height="38" fill="rgba(144,133,233,0.16)" stroke="#5b5299"/>
    <text x="172" y="319" fill="#dde9f3">20×10×20 · 96 ch</text>
    <rect x="210" y="356" width="190" height="38" fill="rgba(144,133,233,0.19)" stroke="#5b5299"/>
    <text x="222" y="379" fill="#dde9f3">10×5×10 · 192 ch</text>
    <!-- bottleneck -->
    <rect x="435" y="410" width="190" height="38" fill="rgba(144,133,233,0.25)" stroke="#9085e9"/>
    <text x="453" y="433" fill="#dde9f3">5×3×5 · 384 ch</text>
    <!-- decoder -->
    <rect x="660" y="356" width="190" height="38" fill="rgba(144,133,233,0.19)" stroke="#5b5299"/>
    <text x="672" y="379" fill="#dde9f3">10×5×10 · 192 ch</text>
    <rect x="710" y="296" width="190" height="38" fill="rgba(144,133,233,0.16)" stroke="#5b5299"/>
    <text x="722" y="319" fill="#dde9f3">20×10×20 · 96 ch</text>
    <rect x="760" y="236" width="190" height="38" fill="rgba(144,133,233,0.13)" stroke="#5b5299"/>
    <text x="772" y="259" fill="#dde9f3">40×20×40 · 48 ch</text>
    <rect x="810" y="176" width="190" height="38" fill="rgba(144,133,233,0.10)" stroke="#5b5299"/>
    <text x="822" y="199" fill="#dde9f3">80×40×80 · 24 ch</text>
  </g>

  <!-- down / up arrows -->
  <g stroke="#9085e9" stroke-width="1.4" fill="none">
    <path d="M150 148 V172" marker-end="url(#v)"/>
    <path d="M155 214 V232" marker-end="url(#v)"/>
    <path d="M205 274 V292" marker-end="url(#v)"/>
    <path d="M255 334 V352" marker-end="url(#v)"/>
    <path d="M305 394 V429 H431" marker-end="url(#v)"/>
    <path d="M629 429 H755 V398" marker-end="url(#v)"/>
    <path d="M805 356 V338" marker-end="url(#v)"/>
    <path d="M855 296 V278" marker-end="url(#v)"/>
    <path d="M905 236 V218" marker-end="url(#v)"/>
    <path d="M905 176 V152" marker-end="url(#v)"/>
  </g>
  <g fill="#8b98a9" font-size="10.5">
    <text x="24" y="250">down:</text>
    <text x="24" y="264">max-pool ½</text>
    <text x="962" y="300">up: trilinear</text>
    <text x="962" y="314">×2, then</text>
    <text x="962" y="328">concat the skip</text>
  </g>

  <!-- skip connections -->
  <g stroke="#6fa8c8" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M252 195 H806" marker-end="url(#g)"/>
    <path d="M302 255 H756" marker-end="url(#g)"/>
    <path d="M352 315 H706" marker-end="url(#g)"/>
    <path d="M402 375 H656" marker-end="url(#g)"/>
  </g>
  <text x="530" y="189" fill="#6fa8c8" font-size="10.5" text-anchor="middle">skip connections keep the 6 mm detail (fan edges, vents, heat sinks)</text>
  <text x="530" y="472" fill="#8b98a9" font-size="10.5" text-anchor="middle">at 5 × 3 × 5 every feature sees the whole case: a fan on the top changes the flow at the front</text>
</svg>
