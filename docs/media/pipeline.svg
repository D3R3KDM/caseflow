<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1328 372" width="1328" height="372" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>CaseFlow simulation pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fa8c8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9772b"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#63e0ff"/></marker>
  </defs>
  <rect width="1328" height="372" fill="#0b1119"/>
  <text x="24" y="34" fill="#dde9f3" font-size="16" font-weight="700">From a parts list to a ranked layout, for any room, load and fan curve</text>
  <text x="24" y="54" fill="#8b98a9" font-size="12">steps 2–6 run once per layout on the GPU (~90 s for all three fan speeds, cached) · steps 7–8 run in the browser in milliseconds, every time a setting moves</text>

  <!-- group brackets -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5">
    <path d="M186 80 V74 H982 V80" stroke="#8a5328" fill="none"/>
    <text x="584" y="70" fill="#d9772b" text-anchor="middle">ONCE PER LAYOUT · GPU · the bank</text>
    <path d="M1000 80 V74 H1304 V80" stroke="#2f7fa3" fill="none"/>
    <text x="1152" y="70" fill="#63e0ff" text-anchor="middle">EVERY SCENARIO · BROWSER</text>
  </g>

  <!-- boxes: x = 24 + i*162, width 144 -->
  <g font-size="12">
    <g transform="translate(24,90)">
      <rect width="144" height="140" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">01</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Parts library</text>
      <text x="12" y="66" fill="#8b98a9">case, GPU, cooler,</text>
      <text x="12" y="82" fill="#8b98a9">CPU, fans, default</text>
      <text x="12" y="98" fill="#8b98a9">curves, load presets</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">library.json</text>
    </g>
    <g transform="translate(186,90)">
      <rect width="144" height="140" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">02</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Voxel model</text>
      <text x="12" y="66" fill="#8b98a9">80 × 40 × 80 cells</text>
      <text x="12" y="82" fill="#8b98a9">of 6 mm: solids,</text>
      <text x="12" y="98" fill="#8b98a9">fans, openings, heat</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">build_model()</text>
    </g>
    <g transform="translate(348,90)">
      <rect width="144" height="140" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">03</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Three fan speeds</text>
      <text x="12" y="66" fill="#8b98a9">case fans at 12, 45</text>
      <text x="12" y="82" fill="#8b98a9">and 100 % duty: an</text>
      <text x="12" y="98" fill="#8b98a9">operating point each</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">operating_point()</text>
    </g>
    <g transform="translate(510,90)">
      <rect width="144" height="140" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">04</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Airflow × 3</text>
      <text x="12" y="66" fill="#8b98a9">D3Q19 lattice</text>
      <text x="12" y="82" fill="#8b98a9">Boltzmann, all three</text>
      <text x="12" y="98" fill="#8b98a9">in one GPU batch</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">run_airflow_batch()</text>
    </g>
    <g transform="translate(672,90)">
      <rect width="144" height="140" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">05</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Heat per watt</text>
      <text x="12" y="66" fill="#8b98a9">air rise per W of</text>
      <text x="12" y="82" fill="#8b98a9">CPU and of GPU heat,</text>
      <text x="12" y="98" fill="#8b98a9">for each airflow</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">solve_unit_fields()</text>
    </g>
    <g transform="translate(834,90)">
      <rect width="144" height="140" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">06</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Dust → bank</text>
      <text x="12" y="66" fill="#8b98a9">40 000 particles per</text>
      <text x="12" y="82" fill="#8b98a9">airflow; summary +</text>
      <text x="12" y="98" fill="#8b98a9">8-bit 3D fields, cached</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">engine/bank.py</text>
    </g>
    <g transform="translate(1000,90)">
      <rect width="144" height="140" fill="rgba(99,224,255,0.08)" stroke="#2f7fa3"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">07</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Steady state</text>
      <text x="12" y="66" fill="#8b98a9">room + load + curves:</text>
      <text x="12" y="82" fill="#8b98a9">fan speeds ⇄ temps,</text>
      <text x="12" y="98" fill="#8b98a9">throttling, noise</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">scenario.ts / .py</text>
    </g>
    <g transform="translate(1162,90)">
      <rect width="144" height="140" fill="rgba(99,224,255,0.08)" stroke="#2f7fa3"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">08</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Rank + 3D</text>
      <text x="12" y="66" fill="#8b98a9">CPU + GPU °C + 2 ×</text>
      <text x="12" y="82" fill="#8b98a9">dust, all 32 layouts;</text>
      <text x="12" y="98" fill="#8b98a9">heat field recoloured</text>
      <text x="12" y="126" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">App.tsx · fields.ts</text>
    </g>
  </g>
  <!-- forward arrows -->
  <g stroke="#6fa8c8" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M168 160 H184"/><path d="M330 160 H346"/><path d="M492 160 H508"/>
    <path d="M654 160 H670"/><path d="M816 160 H832"/><path d="M978 160 H998"/><path d="M1144 160 H1160"/>
  </g>
  <!-- loops -->
  <path d="M906 230 V280 H258 V234" stroke="#d9772b" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="582" y="300" fill="#d9772b" font-size="12" text-anchor="middle">next layout: move / flip your three fans (C(4,3) × 2³ = 32)</text>
  <path d="M1234 230 V280 H1072 V234" stroke="#63e0ff" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/>
  <text x="1153" y="300" fill="#63e0ff" font-size="12" text-anchor="middle">move a slider, drag a curve</text>
  <text x="24" y="346" fill="#6b7a8c" font-size="11">For a fixed airflow the air's temperature rise is proportional to power, so the bank's per-watt fields cover every load; between the three fan speeds they are interpolated in 1 / speed.</text>
</svg>
