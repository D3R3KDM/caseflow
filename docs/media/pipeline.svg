<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" width="1160" height="330" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>CaseFlow simulation pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fa8c8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9772b"/></marker>
  </defs>
  <rect width="1160" height="330" fill="#0b1119"/>
  <text x="24" y="34" fill="#dde9f3" font-size="16" font-weight="700">From a parts list to a ranked layout</text>
  <text x="24" y="54" fill="#8b98a9" font-size="12">one layout ≈ 35 s on an RTX 5080 · steps 3–7 repeat for each of the 32 fan layouts</text>

  <!-- boxes: x = 24 + i*162, width 144 -->
  <g font-size="12">
    <g transform="translate(24,84)">
      <rect width="144" height="132" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">01</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Parts library</text>
      <text x="12" y="66" fill="#8b98a9">case, GPU, cooler,</text>
      <text x="12" y="82" fill="#8b98a9">fan specs + mounts</text>
      <text x="12" y="98" fill="#8b98a9">with source links</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">library.json</text>
    </g>
    <g transform="translate(186,84)">
      <rect width="144" height="132" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">02</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Voxel model</text>
      <text x="12" y="66" fill="#8b98a9">80 × 40 × 80 cells</text>
      <text x="12" y="82" fill="#8b98a9">of 6 mm: solids,</text>
      <text x="12" y="98" fill="#8b98a9">fans, openings, heat</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">build_model()</text>
    </g>
    <g transform="translate(348,84)">
      <rect width="144" height="132" fill="rgba(217,119,43,0.07)" stroke="#8a5328"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">03</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Fan operating point</text>
      <text x="12" y="66" fill="#8b98a9">fan curves against</text>
      <text x="12" y="82" fill="#8b98a9">one case pressure,</text>
      <text x="12" y="98" fill="#8b98a9">solved by bisection</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">operating_point()</text>
    </g>
    <g transform="translate(510,84)">
      <rect width="144" height="132" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">04</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Airflow</text>
      <text x="12" y="66" fill="#8b98a9">D3Q19 lattice</text>
      <text x="12" y="82" fill="#8b98a9">Boltzmann, 8 000</text>
      <text x="12" y="98" fill="#8b98a9">steps, time-averaged</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">engine/lbm.py</text>
    </g>
    <g transform="translate(672,84)">
      <rect width="144" height="132" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">05</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Heat</text>
      <text x="12" y="66" fill="#8b98a9">CPU + GPU watts</text>
      <text x="12" y="82" fill="#8b98a9">carried by the flow</text>
      <text x="12" y="98" fill="#8b98a9">→ intake air rise (converged)</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">thermal.py</text>
    </g>
    <g transform="translate(834,84)">
      <rect width="144" height="132" fill="rgba(140,200,255,0.05)" stroke="#2a4a63"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">06</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Dust</text>
      <text x="12" y="66" fill="#8b98a9">40 000 particles,</text>
      <text x="12" y="82" fill="#8b98a9">20 µm, filters,</text>
      <text x="12" y="98" fill="#8b98a9">drift + settle + stick</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">simulate_dust()</text>
    </g>
    <g transform="translate(996,84)">
      <rect width="144" height="132" fill="rgba(99,224,255,0.08)" stroke="#2f7fa3"/>
      <text x="12" y="22" fill="#63e0ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">07</text>
      <text x="12" y="44" fill="#dde9f3" font-weight="700" font-size="13">Score + views</text>
      <text x="12" y="66" fill="#8b98a9">CPU °C + GPU °C</text>
      <text x="12" y="82" fill="#8b98a9">+ 2 × dust share,</text>
      <text x="12" y="98" fill="#8b98a9">ranked, packaged</text>
      <text x="12" y="120" fill="#6b7a8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">optimize.py</text>
    </g>
  </g>
  <!-- forward arrows -->
  <g stroke="#6fa8c8" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M168 150 H184"/><path d="M330 150 H346"/><path d="M492 150 H508"/>
    <path d="M654 150 H670"/><path d="M816 150 H832"/><path d="M978 150 H994"/>
  </g>
  <!-- search loop -->
  <path d="M1068 216 V266 H420 V220" stroke="#d9772b" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="744" y="286" fill="#d9772b" font-size="12" text-anchor="middle">next layout: move / flip your three fans (C(4,3) × 2³ = 32)</text>
  <text x="24" y="316" fill="#6b7a8c" font-size="11">Steps 1–2 run once per build. The web app reads the packaged result: velocity + temperature fields (float16), part temperatures, dust deposits.</text>
</svg>
